      <tspan font-weight="800">Sales</tspan><tspan font-weight="400">Studio</tspan>
    </text>
    <!-- Tagline: Think Real Estate. Think Us. -->
    <text x="4" y="148" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" letter-spacing="5.2" text-transform="uppercase" opacity="0.85">Think Real Estate. Think Us.</text>
